      <text x="10" y="20" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#FBBF24">Retention Analytics</text>
      <text x="10" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#E2E8F0">CatBoost 52 feats (:4008)</text>
      <text x="10" y="50" font-family="'Inter', sans-serif" font-size="8.5" fill="#94A3B8">TreeSHAP + What-If (:4003)</text>
      <text x="10" y="62" font-family="'Inter', sans-serif" font-size="8" fill="#F59E0B">Optuna Tuned τ=0.33</text>
