      <text x="14" y="35" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Transcripts, ASAG Scores, Attrition Records</text>
    </g>
    <g transform="translate(755, 12)">
      <rect width="240" height="44" rx="6" fill="#1E293B" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#F87171">Model Registry &amp; Artifacts</text>
      <text x="14" y="35" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">ONNX Models, CatBoost Dumps, SHAP trees</text>
