      <text x="10" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#E2E8F0">DeBERTa-v3 12L (:4010)</text>
      <text x="10" y="50" font-family="'Inter', sans-serif" font-size="8.5" fill="#94A3B8">Platt Calibration (0–100)</text>
      <text x="10" y="62" font-family="'Inter', sans-serif" font-size="8" fill="#F59E0B">5 Ordinal Tiers</text>
    </g>
    <g transform="translate(820, 14)">
