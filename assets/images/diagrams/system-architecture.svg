  <rect width="1100" height="580" rx="16" fill="url(#tierBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="42" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">Five-Tier Enterprise Talent Intelligence Architecture</text>
  <text x="40" y="65" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Separation of application logic, AI microservices, persistence, and governance (Twelve Service Containers)</text>

