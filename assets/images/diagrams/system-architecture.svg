    <text x="20" y="32" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">TIER 1 : CLIENT PRESENTATION</text>
    <text x="20" y="52" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="rgba(255,255,255,0.85)">React 18 + Vite Frontend SPA</text>
    
    <g transform="translate(235, 14)">
      <rect width="240" height="46" rx="6" fill="#1E293B" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="22" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#38BDF8">Candidate Portal</text>
      <text x="14" y="38" font-family="'Inter', sans-serif" font-size="9.5" fill="#94A3B8">Resume Upload, Audio Record, WebRTC</text>
    </g>
    <g transform="translate(495, 14)">
      <rect width="240" height="46" rx="6" fill="#1E293B" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="22" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#38BDF8">Recruiter Workspace</text>
      <text x="14" y="38" font-family="'Inter', sans-serif" font-size="9.5" fill="#94A3B8">Rankings, Cross-Encoder Inspect, Review</text>
    </g>
    <g transform="translate(755, 14)">
      <rect width="240" height="46" rx="6" fill="#1E293B" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="22" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#38BDF8">Interview &amp; Attrition Studio</text>
      <text x="14" y="38" font-family="'Inter', sans-serif" font-size="9.5" fill="#94A3B8">Platt Rubrics, TreeSHAP, What-If Sim</text>
    </g>
  </g>

  <!-- TIER 2 -->
  <g transform="translate(40, 175)">
    <rect width="1020" height="66" rx="10" fill="#0F172A" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1.2"/>
