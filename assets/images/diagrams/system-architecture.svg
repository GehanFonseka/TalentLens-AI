      <text x="10" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#E2E8F0">Faster-Whisper Tiny (:4005)</text>
      <text x="10" y="50" font-family="'Inter', sans-serif" font-size="8.5" fill="#94A3B8">Silero VAD, 16kHz INT8</text>
      <text x="10" y="62" font-family="'Inter', sans-serif" font-size="8" fill="#F59E0B">Real-time Stream Trans</text>
