      <text x="14" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#818CF8">Dynamic Reverse Proxy</text>
      <text x="14" y="34" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">REST Routing to 12 Microservices</text>
    </g>
  </g>

