    <text x="20" y="28" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">TIER 2 : API GATEWAY</text>
    <text x="20" y="48" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="rgba(255,255,255,0.85)">Express.js :8080 Security Hub</text>
    
    <g transform="translate(235, 11)">
      <rect width="240" height="42" rx="6" fill="#1E293B" stroke="rgba(255,255,255,0.08)"/>
