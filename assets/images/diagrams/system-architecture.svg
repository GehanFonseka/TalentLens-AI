      <text x="10" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Node.js :4004</text>
    </g>
    <g transform="translate(820, 14)">
      <rect width="180" height="46" rx="6" fill="#1E293B" stroke="rgba(255,255,255,0.08)"/>
      <text x="10" y="20" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#34D399">Interview Domain</text>
      <text x="10" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Node.js :4006/:4007</text>
