<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="tlGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070E1A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tlBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="tlIrisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="tlAccentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="tlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="#0B1324"/>
  <rect width="64" height="64" rx="16" fill="url(#tlGlowGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#tlBorderGrad)" stroke-width="1.5"/>

  <!-- Optical Lens Focus Ring -->
  <circle cx="32" cy="32" r="23" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" stroke-dasharray="2 3"/>
  <circle cx="32" cy="32" r="18.5" stroke="url(#tlBorderGrad)" stroke-width="1" opacity="0.6"/>

  <!-- Aperture Blades (Lens Motif forming dynamic geometry) -->
  <g filter="url(#tlGlow)">
    <path d="M32 13 C38 13, 45 18, 48 25 L38 30.5 C37 26.5, 34 23.5, 30 23.5 L32 13 Z" fill="url(#tlIrisGrad)" opacity="0.95"/>
    <path d="M51 32 C51 38, 46 45, 39 48 L33.5 38 C37.5 37, 40.5 34, 40.5 30 L51 32 Z" fill="url(#tlAccentGrad)" opacity="0.9"/>
    <path d="M32 51 C26 51, 19 46, 16 39 L26 33.5 C27 37.5, 30 40.5, 34 40.5 L32 51 Z" fill="url(#tlIrisGrad)" opacity="0.95"/>
    <path d="M13 32 C13 26, 18 19, 25 16 L30.5 26 C26.5 27, 23.5 30, 23.5 34 L13 32 Z" fill="url(#tlAccentGrad)" opacity="0.9"/>
  </g>

  <!-- Central Intelligence Core / AI Focal Prism -->
  <circle cx="32" cy="32" r="9" fill="#070E1A" stroke="url(#tlBorderGrad)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="6" fill="#10B981" opacity="0.25"/>
  
  <!-- 4-Point AI Starburst Spark -->
  <path d="M32 24.5 L33.5 30.5 L39.5 32 L33.5 33.5 L32 39.5 L30.5 33.5 L24.5 32 L30.5 30.5 Z" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="1.8" fill="#34D399"/>
</svg>
