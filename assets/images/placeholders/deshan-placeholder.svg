<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="grad_KD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="glow_KD" cx="50%" cy="32%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid_KD" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" rx="20" fill="url(#grad_KD)"/>
  <rect width="400" height="480" rx="20" fill="url(#grid_KD)"/>
  <circle cx="200" cy="155" r="130" fill="url(#glow_KD)"/>

  <!-- Border -->
  <rect x="2" y="2" width="396" height="476" rx="18" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>

  <!-- Stylized Academic Silhouette & Avatar Frame -->
  <g transform="translate(200, 155)">
    <circle cx="0" cy="0" r="78" fill="rgba(15, 23, 42, 0.85)" stroke="#60A5FA" stroke-width="2.5"/>
    <path d="M-42,66 C-42,32 -25,16 0,16 C25,16 42,32 42,66 Z" fill="rgba(148, 163, 184, 0.35)"/>
    <circle cx="0" cy="-12" r="32" fill="rgba(148, 163, 184, 0.45)"/>
    <rect x="-26" y="-36" width="52" height="52" rx="14" fill="rgba(11, 19, 43, 0.95)" stroke="#60A5FA" stroke-width="1.8"/>
    <text x="0" y="0" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" letter-spacing="1">KD</text>
  </g>

  <!-- Photo replace callout -->
  <g transform="translate(200, 260)">
    <rect x="-72" y="-14" width="144" height="28" rx="14" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
    <circle cx="-50" cy="0" r="5" fill="none" stroke="#60A5FA" stroke-width="1.8"/>
    <path d="M -50 -2 L -50 2 M -52 0 L -48 0" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="10" y="1" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle" dominant-baseline="central">Drop Photo Here</text>
  </g>

  <!-- Metadata -->
  <text x="200" y="318" font-family="'Inter', system-ui, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">Kavishka Deshan</text>
  <text x="200" y="344" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#60A5FA" text-anchor="middle" letter-spacing="1.5">IT22195616</text>
  <text x="200" y="372" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="#CBD5E1" text-anchor="middle">Job-Candidate Matching & XAI</text>

  <!-- Notice Banner across bottom -->
  <g transform="translate(0, 412)">
    <rect width="400" height="68" rx="0" fill="rgba(11, 19, 43, 0.96)"/>
    <line x1="0" y1="0" x2="400" y2="0" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="200" y="26" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1">SAMPLE IDENTIFICATION PHOTO</text>
    <text x="200" y="46" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">Replace with official portrait before viva</text>
  </g>
</svg>